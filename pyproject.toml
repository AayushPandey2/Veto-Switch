[project]
name = "killswitchx"
version = "0.1.0"
description = "Human-approved, proof-driven vulnerability containment and recovery"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "flask>=3.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["security/tests"]
pythonpath = ["."]
addopts = "-m 'not network'"
markers = [
    "docker: needs a running Docker daemon (skipped otherwise)",
    "network: needs internet access to a public advisory API (skipped by default)",
]
