[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "killswitch-x"
version = "0.1.0"
description = "Killswitch X — AI-assisted, evidence-driven cybersecurity incident containment, remediation and recovery platform foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]
graph = [
    "networkx>=3.3,<4.0",
]
platform = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "flask>=3.0,<4.0",
]
ai = [
    "tenacity>=9.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "agent_core*", "remediation*"]
exclude = ["platform*", "security*", "tests*", "docs*", "scripts*", "config*", "artifacts*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "agent_core/tests", "remediation/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: Fast offline unit tests for shared foundation and validation.",
    "contract: Service protocol, boundary, and fixture contract tests.",
    "integration: Cross-component orchestration and recovery workflow tests.",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["shared", "agent_core", "remediation", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "S",
    "RUF",
]
ignore = [
    "S105", # False positives on enum/constant names containing 'token' or 'secret'
    "S106", # False positives on redaction test placeholders
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"agent_core/tests/**" = ["S101", "S105", "S106"]
"remediation/tests/**" = ["S101", "S105", "S106"]
"agent_core/simulations/**" = ["S101"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
